<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="你是哪种开会人？娱乐向短测评，测完一键保存卡通海报。仅供娱乐，不构成专业建议。"
    />
    <title>你是哪种开会人？</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 首页 -->
      <section id="screen-home" class="card">
        <div id="demo-badge" class="badge">Demo 示例题库</div>
        <h1 id="home-title">你是哪种开会人？</h1>
        <p id="home-oneliner" class="one-liner">测完晒出你的开会人设</p>
        <p class="lead">
          5 道短题，约 1 分钟。出专属卡通海报，同事群里晒着玩。
        </p>
        <ul class="features">
          <li>题干一屏可读，选项短句</li>
          <li>卡通海报清晰可存，更好晒</li>
          <li>娱乐向 · 不做诊断</li>
        </ul>
        <div id="home-disclaimer" class="disclaimer-box"></div>
        <div class="btn-row single">
          <button id="btn-start" type="button" class="btn btn-primary">
            开始测评
          </button>
        </div>
      </section>

      <!-- 答题 -->
      <section id="screen-quiz" class="card hidden">
        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="progress-text">第 1 / 5 题</span>
            <span>开会人设</span>
          </div>
          <div class="progress-bar" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>
        <h2 id="stem" class="stem"></h2>
        <div id="options" class="options" role="listbox" aria-label="选项"></div>
        <div class="btn-row">
          <button id="btn-prev" type="button" class="btn btn-ghost">上一题</button>
          <button id="btn-next" type="button" class="btn btn-primary" disabled>
            下一题
          </button>
        </div>
      </section>

      <!-- 结果 -->
      <section id="screen-result" class="card result-card hidden">
        <p id="result-unlock" class="result-unlock">恭喜解锁开会人设！</p>
        <div class="result-art-wrap">
          <img
            id="result-art"
            class="result-art"
            alt="人设卡通海报"
            width="280"
            height="280"
          />
          <div id="result-sparkles" class="sparkles" aria-hidden="true"></div>
        </div>
        <div id="result-accent" class="result-accent"></div>
        <p id="result-fun-tag" class="result-fun-tag"></p>
        <h2 id="result-title" class="result-title"></h2>
        <p id="result-summary" class="result-summary"></p>
        <p id="result-detail" class="result-detail"></p>
        <div id="result-disclaimer" class="disclaimer-box"></div>
        <div class="actions-stack">
          <button id="btn-save-poster" type="button" class="btn btn-primary">
            保存海报晒朋友圈
          </button>
          <button id="btn-copy-share" type="button" class="btn btn-secondary">
            复制分享文案
          </button>
          <button id="btn-retake" type="button" class="btn btn-ghost">
            再测一次
          </button>
        </div>
      </section>

      <p id="footer-text" class="footer">仅供娱乐，不构成专业建议。</p>
    </div>

    <!-- 海报离屏画布 -->
    <div class="poster-stage" aria-hidden="true">
      <div id="poster" class="poster">
        <div class="poster-brand">开会人设测评</div>
        <div class="poster-badge">仅供娱乐</div>
        <img id="poster-art" class="poster-art" alt="" width="280" height="280" />
        <h3 id="poster-title" class="poster-title"></h3>
        <p id="poster-line" class="poster-line"></p>
        <p id="poster-summary" class="poster-summary"></p>
        <div class="poster-foot">
          本测评仅供娱乐与自我反思，不构成心理咨询、医学诊断或任何专业建议。<br />
          Demo · quiz-demo-meeting
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- html2canvas CDN；离线时海报功能会提示失败 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="./js/quiz-data.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
